<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResearchBot — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111115;
    --border: #1e1e26;
    --accent: #00ff9d;
    --accent2: #7b5ea7;
    --accent3: #ff6b35;
    --text: #e2e2e8;
    --muted: #5a5a6e;
    --green: #00ff9d;
    --yellow: #ffd93d;
    --red: #ff4757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* grid noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,157,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,157,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,12,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 12px var(--accent); }
    50% { opacity: 0.5; box-shadow: 0 0 4px var(--accent); }
  }

  .status-bar {
    font-size: 0.7rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .status-live {
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  main {
    position: relative;
    z-index: 1;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* STAT CARDS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent-color, var(--accent));
  }

  .stat-card:hover { border-color: var(--accent); }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--accent-color, var(--accent));
    line-height: 1;
  }

  .stat-sub {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  /* MAIN GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .panel-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .panel-title .icon { color: var(--accent); }

  .panel-body { padding: 1.5rem; }

  /* SCORE CHART */
  .chart-container {
    height: 160px;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding-top: 1rem;
  }

  .chart-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }

  .chart-bar {
    width: 100%;
    border-radius: 2px 2px 0 0;
    transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    min-height: 4px;
  }

  .chart-bar:hover::after {
    content: attr(data-val);
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1px 4px;
    white-space: nowrap;
  }

  .chart-date {
    font-size: 0.55rem;
    color: var(--muted);
    transform: rotate(-45deg);
    white-space: nowrap;
    margin-top: 4px;
  }

  /* TIMELINE */
  .timeline { display: flex; flex-direction: column; gap: 0; }

  .timeline-item {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .timeline-item:last-child { border-bottom: none; }

  .timeline-date {
    font-size: 0.65rem;
    color: var(--accent);
    font-weight: 600;
    padding-top: 2px;
  }

  .timeline-content {}

  .timeline-title {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: var(--text);
  }

  .timeline-summary {
    font-size: 0.65rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 0.4rem;
  }

  .timeline-trends {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    font-size: 0.6rem;
    padding: 2px 6px;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 2px;
  }

  /* COMPETITOR CARDS */
  .competitor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }

  .competitor-card {
    border: 1px solid var(--border);
    padding: 1rem;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
  }

  .competitor-card:hover {
    border-color: var(--accent2);
    background: rgba(123,94,167,0.05);
  }

  .competitor-name {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  .competitor-meta {
    font-size: 0.6rem;
    color: var(--muted);
  }

  .competitor-badge {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* PROJECTS */
  .projects-summary {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .project-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 1rem;
    align-items: center;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .project-row:last-child { border-bottom: none; }
  .project-row:hover { background: rgba(0,255,157,0.02); }

  .project-name {
    font-size: 0.75rem;
    font-weight: 600;
  }

  .project-mcu {
    font-size: 0.62rem;
    color: var(--accent2);
    padding: 2px 6px;
    border: 1px solid var(--accent2);
    border-radius: 2px;
    white-space: nowrap;
  }

  .project-price {
    font-size: 0.7rem;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }

  .empty-state {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.75rem;
  }

  /* RUN LOG */
  .run-list { display: flex; flex-direction: column; gap: 0; }

  .run-item {
    display: grid;
    grid-template-columns: 60px auto 1fr;
    gap: 0.75rem;
    align-items: center;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.65rem;
  }

  .run-item:last-child { border-bottom: none; }

  .run-id { color: var(--muted); font-family: monospace; }

  .run-status {
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
  }

  .status-completed { background: rgba(0,255,157,0.1); color: var(--accent); }
  .status-failed { background: rgba(255,71,87,0.1); color: var(--red); }
  .status-started { background: rgba(255,217,61,0.1); color: var(--yellow); }

  .run-summary { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* loading */
  .loading {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.7rem;
    padding: 1rem 0;
  }

  .loading-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1s ease-in-out infinite;
  }

  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .main-grid, .bottom-grid { grid-template-columns: 1fr; }
    .competitor-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    RESEARCHBOT
  </div>
  <div class="status-bar">
    <span class="status-live">
      <div class="logo-dot" style="width:6px;height:6px;"></div>
      LIVE
    </span>
    <span id="current-time">--:--:--</span>
    <span>RPi 5 · 24/7</span>
  </div>
</header>

<main>

  <!-- STAT CARDS -->
  <div class="stats-grid">
    <div class="stat-card" style="--accent-color: var(--accent)">
      <div class="stat-label">Dokončené runy</div>
      <div class="stat-value" id="stat-runs">—</div>
      <div class="stat-sub">celkem spuštěno</div>
    </div>
    <div class="stat-card" style="--accent-color: var(--accent2)">
      <div class="stat-label">Sledovaná témata</div>
      <div class="stat-value" id="stat-topics">—</div>
      <div class="stat-sub">unikátních queries</div>
    </div>
    <div class="stat-card" style="--accent-color: var(--accent3)">
      <div class="stat-label">Reporty</div>
      <div class="stat-value" id="stat-reports">—</div>
      <div class="stat-sub">markdown soubory</div>
    </div>
    <div class="stat-card" style="--accent-color: var(--yellow)">
      <div class="stat-label">Poslední run</div>
      <div class="stat-value" style="font-size:1rem;padding-top:0.5rem;" id="stat-last">—</div>
      <div class="stat-sub">čas dokončení</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- SCORE CHART -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><span class="icon">▲</span> Relevance Score — posledních 14 dní</div>
      </div>
      <div class="panel-body">
        <div class="chart-container" id="score-chart">
          <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
        </div>
      </div>
    </div>

    <!-- RUN LOG -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><span class="icon">◉</span> Run log</div>
      </div>
      <div class="panel-body" style="padding:0 1.5rem">
        <div class="run-list" id="run-list">
          <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM GRID -->
  <div class="bottom-grid">

    <!-- TIMELINE -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><span class="icon">≡</span> Timeline reportů</div>
      </div>
      <div class="panel-body" style="padding:0 1.5rem; max-height:400px; overflow-y:auto;">
        <div class="timeline" id="timeline">
          <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div style="display:flex;flex-direction:column;gap:1rem;">

      <!-- COMPETITORS -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title"><span class="icon">◈</span> Competitors</div>
        </div>
        <div class="panel-body">
          <div class="competitor-grid" id="competitor-grid">
            <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
          </div>
        </div>
      </div>

      <!-- PROJECTS SUMMARY -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title"><span class="icon">⬡</span> Projekty — přehled</div>
        </div>
        <div class="panel-body" style="padding:0 1.5rem; max-height:220px; overflow-y:auto;">
          <div class="projects-summary" id="projects-list">
            <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('current-time').textContent =
      now.toLocaleTimeString('cs-CZ');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Fetch helpers
  async function fetchJSON(url) {
    const r = await fetch(url);
    return r.json();
  }

  // Stats
  async function loadStats() {
    try {
      const d = await fetchJSON('/api/stats');
      document.getElementById('stat-runs').textContent = d.total_runs;
      document.getElementById('stat-topics').textContent = d.total_topics;
      document.getElementById('stat-reports').textContent = d.total_reports;
      document.getElementById('stat-last').textContent = d.last_run;
    } catch(e) { console.error('stats', e); }
  }

  // Score chart
  async function loadScoreChart() {
    try {
      const data = await fetchJSON('/api/score_history');
      const el = document.getElementById('score-chart');
      if (!data.length) {
        el.innerHTML = '<div class="empty-state">Žádná data</div>';
        return;
      }
      const max = 10;
      el.innerHTML = data.map(d => {
        const pct = (d.score / max) * 100;
        const color = d.score >= 7 ? 'var(--green)' : d.score >= 4 ? 'var(--yellow)' : 'var(--red)';
        const shortDate = d.date.slice(5);
        return `<div class="chart-bar-wrap">
          <div class="chart-bar" style="height:${pct}%;background:${color};opacity:0.8;" data-val="${d.score}/10" title="${d.date}: ${d.score}/10"></div>
          <div class="chart-date">${shortDate}</div>
        </div>`;
      }).join('');
    } catch(e) { console.error('chart', e); }
  }

  // Run log
  async function loadRunLog() {
    try {
      const data = await fetchJSON('/api/runs');
      const el = document.getElementById('run-list');
      if (!data.length) {
        el.innerHTML = '<div class="empty-state">Žádné záznamy</div>';
        return;
      }
      el.innerHTML = data.slice(0,10).map(r => {
        const statusClass = `status-${r.status}`;
        const time = r.created_at.slice(11,16);
        const date = r.created_at.slice(5,10);
        return `<div class="run-item">
          <span class="run-id">${r.run_id.slice(0,8)}</span>
          <span class="run-status ${statusClass}">${r.status}</span>
          <span class="run-summary" title="${r.summary || ''}">${date} ${time} — ${r.summary ? r.summary.slice(0,60)+'…' : 'no summary'}</span>
        </div>`;
      }).join('');
    } catch(e) { console.error('runs', e); }
  }

  // Timeline
  async function loadTimeline() {
    try {
      const data = await fetchJSON('/api/timeline');
      const el = document.getElementById('timeline');
      if (!data.length) {
        el.innerHTML = '<div class="empty-state">Žádné reporty</div>';
        return;
      }
      el.innerHTML = data.map(r => {
        const tags = (r.trends || []).map(t => `<span class="tag">${t.slice(0,30)}</span>`).join('');
        return `<div class="timeline-item">
          <div class="timeline-date">${r.date.slice(5)}</div>
          <div class="timeline-content">
            <div class="timeline-title">${r.title || r.date}</div>
            <div class="timeline-summary">${r.summary || '—'}</div>
            <div class="timeline-trends">${tags}</div>
          </div>
        </div>`;
      }).join('');
    } catch(e) { console.error('timeline', e); }
  }

  // Competitors
  async function loadCompetitors() {
    try {
      const data = await fetchJSON('/api/competitors');
      const el = document.getElementById('competitor-grid');
      if (!data.length) {
        el.innerHTML = '<div class="empty-state" style="grid-column:span 2">Žádná data</div>';
        return;
      }
      const companies = ['Boston Dynamics','ABB Robotics','KUKA','Fanuc','Universal Robots'];
      const display = companies.map(name => {
        const found = data.find(d => d.name.includes(name.split(' ')[0]));
        return `<div class="competitor-card">
          <div class="competitor-badge"></div>
          <div class="competitor-name">${name}</div>
          <div class="competitor-meta">Aktualizováno: ${found ? found.last_updated : '—'}</div>
        </div>`;
      });
      el.innerHTML = display.join('');
    } catch(e) { console.error('competitors', e); }
  }

  // Projects
  async function loadProjects() {
    try {
      const data = await fetchJSON('/api/projects');
      const el = document.getElementById('projects-list');
      if (!data.length) {
        el.innerHTML = '<div class="empty-state">Žádné projekty. Zkus /project na Discordu!</div>';
        return;
      }
      el.innerHTML = data.map(p => `<div class="project-row">
        <div class="project-name">${p.name}</div>
        <div class="project-mcu">${p.microcontroller}</div>
        <div class="project-price">${p.total_price !== '?' ? p.total_price + ' Kč' : '—'}</div>
      </div>`).join('');
    } catch(e) { console.error('projects', e); }
  }

  // Load all
  async function loadAll() {
    await Promise.all([
      loadStats(),
      loadScoreChart(),
      loadRunLog(),
      loadTimeline(),
      loadCompetitors(),
      loadProjects(),
    ]);
  }

  loadAll();
  // Auto-refresh every 60s
  setInterval(loadAll, 60000);
</script>
</body>
</html>
